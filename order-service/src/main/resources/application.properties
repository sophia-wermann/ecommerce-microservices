spring.application.name=order-service
server.port=8000

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/orders_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:orders_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orders_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── Catalog Service ───────────────────────────────────────────────────────────
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8001}

# ── Swagger UI ────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
